<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion · EQDOM Plateforme clients</title>
<link rel="stylesheet" href="commun.css">
<script src="commun.js" defer></script>
<script src="connexion.js" defer></script>
</head>
<body>
<main>
  <form class="carte connexion" id="formulaire" novalidate>
    <h1>Connexion</h1>
    <p class="sous-titre">Plateforme clients EQDOM · données fictives de démonstration</p>
    <label for="identifiant">Identifiant</label>
    <input id="identifiant" name="identifiant" autocomplete="username" required maxlength="64">
    <label for="mot_de_passe">Mot de passe</label>
    <input id="mot_de_passe" name="mot_de_passe" type="password" autocomplete="current-password" required maxlength="256">
    <p class="erreur" id="erreur" role="alert"></p>
    <button class="bouton bouton-plein" type="submit">Se connecter</button>
    <p class="note">Comptes de démonstration : voir le README du dépôt.</p>
  </form>
</main>
</body>
</html>
